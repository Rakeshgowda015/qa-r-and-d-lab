<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Child practice page — QA R&amp;D Lab</title>
    <style>
      :root { font-family: "Segoe UI", system-ui, sans-serif; color: #233047; background: #f5f7fb; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 20px; box-sizing: border-box; }
      main { width: min(100%, 460px); padding: 28px; border: 1px solid #e6eaf1; border-radius: 14px; background: #fff; box-shadow: 0 12px 35px rgba(41,54,83,.08); }
      .mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; color: #fff; background: #252e46; font-weight: 800; }
      p { color: #78849a; font-size: 14px; line-height: 1.6; }
      button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 7px; color: #fff; background: #6854dd; cursor: pointer; font: 700 13px "Segoe UI", system-ui, sans-serif; }
      button:focus-visible { outline: 3px solid rgba(104,84,221,.36); outline-offset: 2px; }
      output { display: block; margin-top: 18px; color: #398460; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">R&amp;D</div>
      <h1>Child practice page</h1>
      <p>This page opened from the Tabs &amp; windows exercise. Verify its title and content, then return to the opener or close this page.</p>
      <button type="button" onclick="document.querySelector('output').textContent='Child page action completed.'">Run child action</button>
      <button type="button" onclick="window.close()">Close this page</button>
      <output role="status"></output>
    </main>
  </body>
</html>
